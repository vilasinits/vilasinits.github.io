<!-- Header include (no <html>/<head>/<body>) -->
  <style>
    :root{
      --bg:#0e1525; --ink:#e9eef5; --muted:#a7b3c5; --brand:#4db8ff;
      --bar:#0f1b2e; --border:rgba(255,255,255,.12);
    }
    @media (prefers-color-scheme: light){
      :root{ --bg:#f7fbff; --ink:#0f172a; --muted:#475569; --bar:#ffffff; --border:rgba(2,8,23,.12); }
    }
  
    /* Sticky top bar */
    .site-header{
      position: sticky; top: 0; z-index: 50;
      width: 100%;
      backdrop-filter: blur(10px);
      background: color-mix(in oklab, var(--bar) 92%, transparent);
      border-bottom: 1px solid var(--border);
    }
  
    .header-container{
      width: min(1100px, 92vw);
      margin-inline: auto;
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 12px 0;
    }
  
    /* Brand */
    .site-title{
      color: var(--ink) !important; text-decoration: none; font-weight: 800;
      font-size: clamp(1.05rem, 1.6vw, 1.25rem);
      letter-spacing: .2px;
    }
    .site-title:hover{ color: var(--brand) !important; text-decoration: underline; }
  
    /* Nav */
    .site-nav{ display:flex; align-items:center; gap: 14px; }
  
    .nav-list{
      display:flex; align-items:center; gap: 18px;
      list-style:none; margin:0; padding:0;  /* remove bullets/padding */
    }
    .nav-list > li{ list-style:none; }
  
    .page-link{
      color: var(--ink) !important; text-decoration:none; font-weight:600; font-size:.95rem;
      padding: 6px 8px; border-radius:10px;
    }
    .page-link:hover{ color: var(--brand) !important; text-decoration: underline; }
  
    /* Hamburger */
    .menu-btn{
      display:none; background:none; border:1px solid var(--border);
      width:40px; height:36px; border-radius:10px; color:var(--ink); cursor:pointer;
    }
    .menu-btn:hover{
      color: var(--brand);
      border-color: color-mix(in oklab, var(--brand) 50%, var(--border));
    }
  
    /* Mobile menu */
    @media (max-width: 880px){
      .nav-list{
        position: absolute; top: 56px; left: 0; right: 0;
        display: none; flex-direction: column; align-items: flex-start;
        width: 100%; gap: 8px; padding: 10px 4vw 14px;
        background: color-mix(in oklab, var(--bar) 96%, transparent);
        border-bottom: 1px solid var(--border);
      }
      .nav-list.open{ display:flex; }
      .menu-btn{ display:block; }
    }
  </style>
  
  <header class="site-header" role="banner">
    <div class="header-container">
      <a class="site-title" rel="author" href="{{ '/' | relative_url }}">
        {{ site.title | escape }}
      </a>
  
      <nav class="site-nav" role="navigation" aria-label="Primary">
        <button class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="primary-nav" aria-label="Toggle menu">
          <!-- hamburger icon -->
          <svg width="22" height="18" viewBox="0 0 20 14" fill="currentColor" aria-hidden="true">
            <rect y="0" width="20" height="2" rx="1"></rect>
            <rect y="6" width="20" height="2" rx="1"></rect>
            <rect y="12" width="20" height="2" rx="1"></rect>
          </svg>
        </button>
  
        <ul id="primary-nav" class="nav-list">
          <li><a class="page-link" href="{{ '/' | relative_url }}">Home</a></li>
          <li><a class="page-link" href="{{ '/cv.html' | relative_url }}">CV</a></li>
          <li><a class="page-link" href="{{ '/research.html' | relative_url }}">Research</a></li>
          <li><a class="page-link" href="{{ '/softwares.html' | relative_url }}">Softwares</a></li>
          <li><a class="page-link" href="{{ '/talks.html' | relative_url }}">Talks</a></li>
          <li><a class="page-link" href="{{ '/papers.html' | relative_url }}">Papers</a></li>
          <li><a class="page-link" href="{{ '/blog.html' | relative_url }}">Blog</a></li>
          <li><a class="page-link" href="{{ '/travel.html' | relative_url }}">Through my lens</a></li>
        </ul>
      </nav>
    </div>
  </header>
  
  <script>
    // Mobile menu toggle
    (function(){
      const btn = document.getElementById('menu-btn');
      const list = document.getElementById('primary-nav');
      btn.addEventListener('click', () => {
        const open = list.classList.toggle('open');
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    })();
  </script>
