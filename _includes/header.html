<!-- Header include (no <html>/<head>/<body>) -->
  <style>
    :root{
      --bar:#0f1b2e;      /* header background */
      --ink:#e9eef5;      /* header text */
      --brand:#4db8ff;
      --border:rgba(255,255,255,.12);
      --header-h:64px;
    }
    @media (prefers-color-scheme: light){
      :root{ --bg:#f7fbff; --ink:#0f172a; --muted:#475569; --bar:#ffffff; --border:rgba(2,8,23,.12); }
    }
  
   /* Header bar */
    .site-header{
      position: sticky;
      top: 0;
      z-index: 1000;
      background: #0e1525;;
      border-bottom: 1px solid var(--border);
    }

    .site-header .site-title,
    .site-header .page-link,
    .site-header .menu-btn {
      color: #e9eef5 !important;   /* soft white */
    }
  
    .header-container{
      width: min(1100px, 80vw);
      margin-inline: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: var(--header-h);
      padding: 8px 0;
    }
  
    /* Brand */
    .site-title{
      color: var(--ink);
      text-decoration: none;
      font-weight: 800;
      font-size: clamp(1.05rem, 1.6vw, 1.25rem);
    }
    .site-title:hover{ color: var(--brand); }
  
    /* Nav */
    .site-nav{ display:flex; align-items:center; gap: 14px; }
    .nav-list{ display:flex; align-items:center; gap:18px; list-style:none; margin:0; padding:0; }
    .page-link{ color: var(--ink); text-decoration:none; font-weight:600; padding:6px 8px; border-radius:10px; }
    .page-link:hover{ color: var(--brand); text-decoration: underline; }

  
    /* MOBILE: hamburger button — transparent, no white box */
    .menu-btn{
      display:none;             /* hidden on desktop */
      background: transparent;  /* remove white background */
      border: 1px solid var(--border);
      width: 40px; height: 36px;
      border-radius: 10px;
      color: var(--ink);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .menu-btn:hover{
      color: var(--brand);
      border-color: color-mix(in oklab, var(--brand) 40%, var(--border));
    }
    .menu-btn svg{ display:block; }
  
    /* Mobile dropdown */
    @media (max-width: 880px){
      .menu-btn{ display:flex; }              /* show button */
      .nav-list{
        position: absolute;
        top: var(--header-h);                 /* sit below header */
        left: 0; right: 0;
        display: none;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
        padding: 10px 4vw 14px;
        background: color-mix(in oklab, var(--bar) 96%, transparent);
        border-bottom: 1px solid var(--border);
      }
      .nav-list.open{ display:flex; }
    }
  </style>
  
  <header class="site-header" role="banner">
    <div class="header-container">
      <a class="site-title" rel="author" href="{{ '/' | relative_url }}">
        {{ site.title | escape }}
      </a>
  
      <nav class="site-nav" role="navigation" aria-label="Primary">
        <button class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="primary-nav" aria-label="Toggle menu">
          <!-- hamburger icon -->
          <svg width="22" height="18" viewBox="0 0 20 14" fill="currentColor" aria-hidden="true">
            <rect y="0" width="20" height="2" rx="1"></rect>
            <rect y="6" width="20" height="2" rx="1"></rect>
            <rect y="12" width="20" height="2" rx="1"></rect>
          </svg>
        </button>
  
        <ul id="primary-nav" class="nav-list">
          <li><a class="page-link" href="{{ '/' | relative_url }}">Home</a></li>
          <li><a class="page-link" href="{{ '/cv.html' | relative_url }}">CV</a></li>
          <li><a class="page-link" href="{{ '/research.html' | relative_url }}">Research</a></li>
          <li><a class="page-link" href="{{ '/softwares.html' | relative_url }}">Softwares</a></li>
          <li><a class="page-link" href="{{ '/talks.html' | relative_url }}">Talks</a></li>
          <li><a class="page-link" href="{{ '/papers.html' | relative_url }}">Papers</a></li>
          <li><a class="page-link" href="{{ '/blog.html' | relative_url }}">Blog</a></li>
          <li><a class="page-link" href="{{ '/travel.html' | relative_url }}">Through my lens</a></li>
        </ul>
      </nav>
    </div>
  </header>
  
  <script>
    // Mobile menu toggle
    (function(){
      const btn = document.getElementById('menu-btn');
      const list = document.getElementById('primary-nav');
      btn.addEventListener('click', () => {
        const open = list.classList.toggle('open');
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    })();
  </script>
