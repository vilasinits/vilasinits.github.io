<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vilasini Tinnaneri Sreekanth</title>
  <style>
    /* CSS styles for the header and navigation */

    /* Header container styles */
    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
    }

    /* Site title styles */
    .site-title {
      font-size: 1.5em; /* Adjust size of the title */
      font-weight: bold;
      text-decoration: none;
      color: #333;
    }

    .site-title:hover {
      color: #007BFF; /* Change color on hover */
    }

    /* Navigation styles */
    .site-nav {
      display: flex;
      align-items: center;
    }

    .site-nav .trigger {
      display: flex;
      gap: 20px; /* Space between links */
    }

    .page-link {
      text-decoration: none;
      color: #333;
      font-weight: bold;
    }

    .page-link:hover {
      color: #007BFF;
    }

    /* For mobile view */
    .nav-trigger {
      display: none; /* Hide checkbox for mobile nav */
    }

    .menu-icon {
      display: none; /* Hide the mobile icon */
    }

    /* Responsive styling for mobile */
    @media (max-width: 768px) {
      .header-container {
        flex-direction: column;
        align-items: flex-start;
      }

      .menu-icon {
        display: inline-block;
        cursor: pointer;
      }

      .trigger {
        display: none;
      }

      #nav-trigger:checked ~ .trigger {
        display: block;
        flex-direction: column;
        gap: 10px;
      }
    }

    /* Full-width header */
.site-header {
  width: 100%;
  background-color: #f8f9fa; /* Change this to match your theme */
  padding: 10px 0; /* Padding to give it some space */
  border-bottom: 1px solid #e5e5e5; /* Optional: Add a border at the bottom */
}

/* Flex container for header */

  max-width: 1200px; /* Center the content within the screen */
  margin: 0 auto; /* Ensure the content is centered */

  align-items: center;
  padding: 0 20px; /* Add some padding to the sides */
}

/* Site title styles */
.site-title {
  font-size: 1.5em; /* Adjust size of the title */

}

}

/* Navigation styles */

}

}

.page-link {

}

}

/* For mobile view */

}

}

/* Responsive styling for mobile */
@media (max-width: 768px) {
  .header-container {

    display: inline-block;

  }

    display: none;
  }

  #nav-trigger:checked ~ .trigger {
    display: block;

    gap: 10px;
  }
}

  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

</head>
<body>

  <header class="site-header">
    <div class="header-container">
      <!-- Site Title -->
      <a class="site-title" rel="author" href="{{ "/" | relative_url }}">{{ site.title | escape }}</a>

          <a class="page-link" href="{{ "/potpourri.html" | relative_url }}">Potpourri of Thoughts</a>

      <!-- Theme Toggle Button -->
    <button id="theme-toggle" aria-label="Switch between light and dark theme">

  </header>

</html>
