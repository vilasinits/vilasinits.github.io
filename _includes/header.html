<!-- Header include (no <html>/<head>/<body>) -->
  <style>
    /* Header bar */
    .site-header{
      position: sticky; top: 0; z-index: 1100;
      background: var(--bar);
      border-bottom: 1px solid var(--bar-border);
      transition: background 0.3s ease, border-color 0.3s ease;
    }
    .header-container{
      width: min(1100px, 92vw);
      margin-inline: auto;
      display: flex; align-items: center; justify-content: space-between;
      min-height: 64px;
      padding: 8px 0;
    }

    /* Header text/icon colour adapts to bar */
    .site-header{ --hdr-ink: var(--ink); }

    /* Title */
    .site-title{
      color: var(--hdr-ink) !important; text-decoration: none;
      font-weight: 800; font-size: clamp(1.05rem, 1.6vw, 1.25rem);
      transition: color 0.2s;
    }
    .site-title:hover{ color: var(--brand) !important; }

    /* Override Minima defaults on .site-nav */
    .site-nav{
      position: static !important;
      float: none !important;
      background-color: transparent !important;
      border: none !important;
      border-radius: 0 !important;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-list{
      display:flex; align-items:center; gap:18px;
      list-style:none; margin:0; padding:0;
    }
    .nav-list li{ margin:0; padding:0; }

    .page-link{
      color: var(--hdr-ink) !important; text-decoration:none; font-weight:600;
      padding:6px 8px; border-radius:10px;
      transition: color 0.2s;
      display: inline !important;
      margin-left: 0 !important;
      font-size: clamp(0.82rem, 1.1vw, 0.95rem);
      white-space: nowrap;
    }
    .page-link:hover{ color: var(--brand) !important; text-decoration: underline; }

    /* On smaller desktops, shrink nav gap before hamburger kicks in */
    @media (max-width: 1050px) and (min-width: 881px){
      .nav-list{ gap:10px; }
      .page-link{ padding:4px 5px; }
    }

    /* Theme toggle */
    .theme-toggle{
      background: transparent;
      border: 1px solid var(--bar-border);
      width: 40px; height: 40px;
      border-radius: 10px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--hdr-ink);
      transition: border-color 0.2s, background 0.2s, color 0.3s;
      -webkit-tap-highlight-color: transparent;
      flex-shrink: 0;
    }
    .theme-toggle:hover{
      border-color: var(--brand);
      background: var(--ring);
    }
    .theme-toggle svg{ width:20px; height:20px; }
    .theme-toggle .icon-sun,
    .theme-toggle .icon-moon{ display:none; }
    [data-theme="dark"] .theme-toggle .icon-sun{ display:block; }
    [data-theme="light"] .theme-toggle .icon-moon{ display:block; }

    /* Hamburger button (mobile only) */
    .menu-btn{
      display:none;
      background: transparent;
      border: 1px solid var(--bar-border);
      width: 44px; height: 44px; border-radius: 10px;
      color: var(--hdr-ink); cursor: pointer;
      align-items: center; justify-content: center;
      position: relative;
      -webkit-tap-highlight-color: transparent;
      flex-shrink: 0;
      transition: border-color 0.2s, background 0.2s;
    }
    .menu-btn:hover{
      border-color: var(--brand);
      background: var(--ring);
    }

    /* Animated bars to X */
    .menu-btn .bar{
      display: block;
      width: 22px; height: 2px;
      background: currentColor;
      border-radius: 2px;
      position: absolute;
      left: 50%; transform: translateX(-50%);
      transition: transform 0.3s ease, opacity 0.2s ease;
    }
    .menu-btn .bar:nth-child(1){ top: 14px; }
    .menu-btn .bar:nth-child(2){ top: 21px; }
    .menu-btn .bar:nth-child(3){ top: 28px; }

    .menu-btn.open .bar:nth-child(1){
      top: 21px;
      transform: translateX(-50%) rotate(45deg);
    }
    .menu-btn.open .bar:nth-child(2){ opacity: 0; }
    .menu-btn.open .bar:nth-child(3){
      top: 21px;
      transform: translateX(-50%) rotate(-45deg);
    }

    /* Backdrop overlay (inside header for shared stacking context) */
    .nav-backdrop{
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.4);
      z-index: 1050;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-backdrop.open{ display: block; }

    /* Mobile drawer */
    @media (max-width: 880px){
      .menu-btn{ display:flex; }

      /* Hide desktop nav links — only show via .open */
      .nav-list{
        display: none !important;
        position: fixed;
        top: 80px;
        right: 12px;
        left: auto;
        width: min(560px, 86vw);
        display: none;
        flex-direction: column; align-items: stretch;
        gap: 4px;
        padding: 12px;
        background: var(--card);
        border: 1px solid var(--divider);
        border-radius: 14px;
        box-shadow: var(--shadow);
        z-index: 1200;
        max-height: calc(100dvh - 96px);
        overflow: auto;
        -webkit-overflow-scrolling: touch;
      }
      .nav-list.open{ display:flex !important; }

      /* In the drawer, links use page ink colour */
      .nav-list .page-link{
        display: block !important;
        padding: 12px 14px;
        font-size: 1.05rem;
        border-radius: 10px;
        color: var(--ink) !important;
      }
      .nav-list .page-link:hover{
        background: var(--ring);
        color: var(--brand) !important;
        text-decoration: none;
      }
    }

    /* Hide Minima's default nav-trigger and menu-icon */
    .nav-trigger, .menu-icon, label[for="nav-trigger"] { display: none !important; }
  </style>

<header class="site-header" role="banner">
  <div class="header-container">
    <a class="site-title" rel="author" href="{{ '/' | relative_url }}">
      {{ site.title | escape }}
    </a>

    <nav class="site-nav" role="navigation" aria-label="Primary">
      <!-- Theme toggle -->
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
        </svg>
      </button>

      <!-- Hamburger button -->
      <button class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="primary-nav" aria-label="Toggle menu">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>

      <!-- Backdrop lives inside header so it shares the stacking context -->
      <div class="nav-backdrop" id="nav-backdrop"></div>

      <ul id="primary-nav" class="nav-list">
        <li><a class="page-link" href="{{ '/' | relative_url }}">Home</a></li>
        <li><a class="page-link" href="{{ '/cv.html' | relative_url }}">CV</a></li>
        <li><a class="page-link" href="{{ '/research.html' | relative_url }}">Research</a></li>
        <li><a class="page-link" href="{{ '/softwares.html' | relative_url }}">Softwares</a></li>
        <li><a class="page-link" href="{{ '/talks.html' | relative_url }}">Talks</a></li>
        <li><a class="page-link" href="{{ '/papers.html' | relative_url }}">Papers</a></li>
        <li><a class="page-link" href="{{ '/blog.html' | relative_url }}">Blog</a></li>
        <li><a class="page-link" href="{{ '/travel.html' | relative_url }}">Through my lens</a></li>
      </ul>
    </nav>
  </div>
</header>

<script>
  (function(){
    var btn      = document.getElementById('menu-btn');
    var list     = document.getElementById('primary-nav');
    var backdrop = document.getElementById('nav-backdrop');

    function closeMenu(){
      list.classList.remove('open');
      btn.classList.remove('open');
      backdrop.classList.remove('open');
      btn.setAttribute('aria-expanded','false');
      document.documentElement.style.overflow = '';
      document.body.style.overflow = '';
    }
    function openMenu(){
      list.classList.add('open');
      btn.classList.add('open');
      backdrop.classList.add('open');
      btn.setAttribute('aria-expanded','true');
      document.documentElement.style.overflow = 'hidden';
      document.body.style.overflow = 'hidden';
    }

    btn.addEventListener('click', function(){
      list.classList.contains('open') ? closeMenu() : openMenu();
    });

    backdrop.addEventListener('click', closeMenu);

    document.addEventListener('keydown', function(e){
      if (e.key === 'Escape' && list.classList.contains('open')) closeMenu();
    });

    list.querySelectorAll('.page-link').forEach(function(link){
      link.addEventListener('click', closeMenu);
    });

    // Theme toggle
    var toggle = document.getElementById('theme-toggle');
    toggle.addEventListener('click', function(){
      var current = document.documentElement.getAttribute('data-theme') || 'dark';
      var next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });
  })();
</script>
