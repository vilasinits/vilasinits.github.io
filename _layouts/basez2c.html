<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}
  <head>
    <meta charset="utf-8">
    <title>{{ page.title }}</title>
  </head>

  <body class=z2c>
    {%- include headerz2c.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>
    
    {%- include footerz2c.html -%}

    <script>
      const imageLinks = document.querySelectorAll('.image-link');
      const imageOverlay = document.getElementById('image-overlay');
      const largeImage = document.getElementById('large-image');
      const closeButton = document.getElementById('close-button');
    
      imageLinks.forEach((link) => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          const largeImagePath = link.getAttribute('href');
          largeImage.setAttribute('src', largeImagePath);
          imageOverlay.style.display = 'block';
    
          // Increase the size of the displayed image
          largeImage.style.maxWidth = '100%'; // Adjust the size as needed
          largeImage.style.maxHeight = '100%'; // Adjust the size as needed
        });
      });
    
      closeButton.addEventListener('click', () => {
        imageOverlay.style.display = 'none';
      });
    
      // Add an event listener to close the overlay when clicking outside
      imageOverlay.addEventListener('click', (event) => {
        if (event.target === imageOverlay) {
          imageOverlay.style.display = 'none';
        }
      });
    </script>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const allowedEmail = 'z2Cmember';
        const loginButton = document.getElementById('login-button');
        const uploadArea = document.getElementById('upload-area');
      
        if (window.netlifyIdentity) {
          // Initialize the widget
          window.netlifyIdentity.init();
      
          // Listen for login button click
          loginButton.addEventListener('click', function() {
            window.netlifyIdentity.open(); // Open login modal
          });
      
          // Customizing the login process
          window.netlifyIdentity.on('login', (user) => {
            if (user.email === allowedEmail) {
              // Show upload area for the allowed user
              uploadArea.style.display = 'block';
            } else {
              // Logout and show an error for unauthorized users
              window.netlifyIdentity.logout();
              alert('Access is restricted. Please contact the administrator.');
            }
          });
      
          // Hide upload area and logout on user logout
          window.netlifyIdentity.on('logout', () => {
            uploadArea.style.display = 'none';
          });
        }
      });
      </script>

    <input type="file" id="file-input" />
    <input type="text" id="link-text" placeholder="Enter Title" />
    <button onclick="uploadFile()">Upload File</button>
    <div id="uploaded-links"></div>
    
    <script>
      async function uploadFile() {
        const fileInput = document.getElementById('file-input');
        const file = fileInput.files[0];
        const linkText = document.getElementById('link-text').value;
      
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = async () => {
          const fileContent = reader.result;
      
          const response = await fetch('/.netlify/functions/upload', {
            method: 'POST',
            body: JSON.stringify({ 
              fileContent: fileContent,
              fileName: file.name
            }),
            headers: { 'Content-Type': 'application/json' },
          });
      
          if (response.ok) {
            const responseData = await response.json();
            const uploadedLinks = document.getElementById('uploaded-links');
            uploadedLinks.innerHTML += `<a href="${responseData.link}">${linkText}</a><br>`;
          } else {
            console.error('Upload failed');
          }
        };
        reader.onerror = error => console.log(error);
      }
      </script>     
  </body>
</html>
